name: collaboration-system

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: collaborationsystem:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_DB: ${POSTGRES_DB:-collaboration_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Issuer: ${JWT_ISSUER:-CollaborationSystem}
      Jwt__Audience: ${JWT_AUDIENCE:-CollaborationSystem.Client}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
      Auth__RefreshTokenCookieSecure: ${REFRESH_TOKEN_COOKIE_SECURE:-false}
      Auth__RefreshTokenLifetimeDays: ${REFRESH_TOKEN_LIFETIME_DAYS:-7}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost:8082}
    ports:
      - "${APP_PORT:-8082}:8080"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - data-protection-keys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 && bash -ec '</dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  data-protection-keys:
