name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Run backend tests
        run: dotnet test backend/tests/CollaborationSystem.Tests/CollaborationSystem.Tests.csproj --configuration Release

  compose-smoke:
    runs-on: ubuntu-latest
    needs:
      - frontend-tests
      - backend-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start development stack
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5227/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Backend health check failed"
          docker compose -f docker-compose.dev.yml logs
          exit 1

      - name: Check frontend is reachable
        run: curl -I http://localhost:5173

      - name: Stop development stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
