<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Т-Банк · Вход</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">Т</div>
            <h1 class="login-title">Вход в систему</h1>
            <p class="login-subtitle">Управление идеями команды</p>
            
            <!-- Форма логина (соответствует POST /api/v1/auth/login) -->
            <form onsubmit="event.preventDefault(); location.href='projects.html';">
                <div class="form-group" style="text-align: left;">
                    <label>Email</label>
                    <input type="email" placeholder="ivan.petrov@tbank.ru" value="ivan.petrov@tbank.ru">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Пароль</label>
                    <input type="password" placeholder="••••••••" value="password">
                </div>
                <button type="submit" class="btn btn-primary w-full" style="justify-content: center; padding: 16px;">
                    Войти
                </button>
            </form>
            
            <div class="dev-mode-note">
                <p style="margin-bottom: 16px;">[DEV] Режим разработчика — выберите тестового пользователя:</p>
                <div class="user-list">
                    <button class="btn btn-outline w-full" onclick="location.href='projects.html'">
                        [@] Иван Петров (ivan.petrov@tbank.ru) — Member
                    </button>
                    <button class="btn btn-outline w-full" onclick="location.href='projects.html'">
                        [@] Елена Смирнова (elena.smirnova@tbank.ru) — Admin
                    </button>
                    <button class="btn btn-outline w-full" onclick="location.href='projects.html'">
                        [@] Алексей Иванов (alexey.ivanov@tbank.ru) — Member
                    </button>
                </div>
                <p style="margin-top: 20px; font-size: 11px;">Production: автоматический вход через доменную учётку (SSO)</p>
            </div>
        </div>
    </div>
</body>
</html>
